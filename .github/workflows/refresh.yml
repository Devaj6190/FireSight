name: Refresh public data
on:
  schedule:
    - cron: "*/30 * * * *"   # GitHub may start scheduled runs a few minutes late
  workflow_dispatch: {}       # "Run workflow" button: use it on stage to show a refresh happening
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install certifi
      - run: python scripts/refresh.py --once
      - name: Commit if changed
        run: |
          git config user.name "firesight-refresh"
          git config user.email "firesight-refresh@users.noreply.github.com"
          # If main moves while the job runs (a PR merges), rebuilding on top of it is safer than
          # rebasing generated JSON: reset to the new main, re-run the refresh, try again.
          for attempt in 1 2 3; do
            git add web/public/buildings web/public/refresh
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push; then exit 0; fi
            echo "main moved (attempt $attempt): rebuilding on the new main"
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/refresh.py --once
          done
          echo "could not push after 3 attempts"; exit 1
