name: Fetch city context
on:
  push:
    branches: ["claude/**"]
    paths: ["scripts/fetch_context.py", ".github/workflows/context.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: context-${{ github.ref }}
  cancel-in-progress: true
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install certifi
      - name: Fetch footprints and streets around each cached building
        run: |
          for f in web/public/buildings/sf-*.json; do
            id="$(basename "$f" .json)"
            r=1500; [ "$id" = sf-3722080 ] && r=2500   # the hero gets the wider skyline
            python -I scripts/fetch_context.py "$id" "$r"
          done
      - name: Commit if changed
        run: |
          git config user.name "firesight-context"
          git config user.email "firesight-context@users.noreply.github.com"
          git add web/public/context
          git diff --cached --quiet || git commit -m "data: city context $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
