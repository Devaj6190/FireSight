<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FireSight AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  /* Night Glass (docs/handoff/design-v2.md): blue is the one interactive colour; red, amber and cyan mean hazards and records only */
  :root {
    --bg: #05070a; --surface: rgba(14, 18, 24, .62); --strong: rgba(12, 15, 20, .86); --line: rgba(255, 255, 255, .09);
    --ink: #eef2f6; --muted: #8b95a3; --action: #3d8bff; --danger: #ff4d4f; --caution: #ffb020; --info: #5ee1ff;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 'Geist', system-ui, sans-serif; }
  model-viewer { width: 100%; height: 100%; background: radial-gradient(circle at 50% 40%, #121a24, #05070a 72%); --poster-color: transparent; --min-hotspot-opacity: 0; }
  .glass { background: var(--surface); border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 8px 32px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.06) inset; }
  .glass-strong { background: var(--strong); border: 1px solid var(--line); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  button { font-family: inherit; }
  .top { position: fixed; top: 0; left: 0; right: 0; padding: 14px 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .title b { display: block; font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .title span { font: 500 10.5px/1.4 'Geist Mono', ui-monospace, monospace; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
  a.back { color: var(--action); text-decoration: none; font-weight: 500; border-radius: 14px; padding: 10px 14px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; }
  .tools { position: fixed; left: 16px; top: 88px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: calc(100vw - 96px); }
  .seg { display: flex; border-radius: 14px; overflow: hidden; }
  .seg[hidden], .tools [hidden] { display: none; }
  .seg button { border: 0; background: transparent; color: var(--ink); font-size: 13px; font-weight: 500; padding: 0 14px; min-height: 44px; }
  .seg button[aria-pressed="true"] { background: var(--action); color: #fff; }
  .pill { border-radius: 14px; border: 1px solid var(--line); color: var(--action); font-size: 13px; font-weight: 500; padding: 0 14px; min-height: 44px; }
  .legend { position: fixed; left: 16px; bottom: 92px; display: flex; flex-direction: column; gap: 3px; font-size: 11px; border-radius: 14px; padding: 8px 10px; }
  .legend[hidden] { display: none; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  .btn { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); border: 0; border-radius: 14px; padding: 16px 26px; min-height: 52px; background: var(--action); color: #fff; font: 600 16px/1 'Geist', system-ui, sans-serif; box-shadow: 0 8px 32px rgba(0,0,0,.45), 0 0 24px rgba(61,139,255,.35); }
  /* shown instead of the AR button when this browser cannot place models on a table */
  .btn.off { background: var(--strong); color: var(--ink); border: 1px solid var(--line); font-weight: 500; font-size: 14px; line-height: 1.3; width: max-content; max-width: min(92vw, 420px); box-sizing: border-box; text-align: center; box-shadow: none; pointer-events: none; }
  .btn[hidden] { display: none; }
  .note { margin: 0; font-size: 12px; color: var(--muted); max-width: 250px; }
  #status { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--muted); }
  #msg { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); max-width: min(92vw, 420px); margin: 0; padding: 10px 14px; border-radius: 14px; border-color: rgba(255,77,79,.6); font-size: 13px; text-align: center; z-index: 6; }
  #msg[hidden] { display: none; }
  /* floor rail, slotted inside model-viewer so it stays on screen in AR */
  .rail { position: fixed; right: 12px; top: 80px; bottom: 92px; display: flex; flex-direction: column; gap: 2px; padding: 4px; border-radius: 14px; overflow-y: auto; scrollbar-width: none; z-index: 3; }
  .rail::-webkit-scrollbar { display: none; }
  .rail[hidden] { display: none; }
  .rail button { flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 5px; min-width: 44px; height: 34px; padding: 0 8px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font: 500 12px/1 'Geist Mono', ui-monospace, monospace; }
  .rail button i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .rail button[aria-pressed="true"] { background: var(--action); color: #fff; }
  /* floor info card, also inside model-viewer */
  .card { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); width: min(calc(100vw - 96px), 400px); max-height: 38vh; overflow-y: auto; border-radius: 20px; padding: 14px 16px 12px; box-sizing: border-box; z-index: 4; box-shadow: 0 8px 32px rgba(0,0,0,.45); }
  .card[hidden] { display: none; }
  .card h3 { margin: 0 28px 6px 0; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h3 em { font: 500 10.5px/1 'Geist Mono', monospace; letter-spacing: .08em; text-transform: uppercase; font-style: normal; color: var(--danger); border: 1px solid rgba(255,77,79,.5); border-radius: 8px; padding: 3px 6px; }
  .card h4 { margin: 10px 0 3px; font: 500 10.5px/1.4 'Geist Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .card ul { margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
  .card li { padding: 3px 0 3px 12px; position: relative; }
  .card li::before { content: ''; position: absolute; left: 0; top: 11px; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .card li.danger::before { background: var(--danger); } .card li.caution::before { background: var(--caution); } .card li.people::before { background: var(--info); }
  .card li small { display: block; color: var(--muted); font: 500 11px/1.4 'Geist Mono', monospace; }
  .card .x { position: absolute; right: 6px; top: 6px; width: 44px; height: 44px; border: 0; background: transparent; color: var(--action); font-size: 20px; }
  /* hotspot labels, pinned to the model: hazard colours on the left edge, glass behind the text */
  .hs { display: block; border: 1px solid var(--line); border-left-width: 4px; border-radius: 10px; padding: 5px 9px; background: var(--strong); color: var(--ink); font: 500 12px/1.25 'Geist', system-ui, sans-serif; max-width: 190px; pointer-events: none; transition: opacity .25s; }
  .hs.fire, .hs.battery, .hs.danger { border-left-color: var(--danger); } .hs.caution { border-left-color: var(--caution); } .hs.people, .hs.info { border-left-color: var(--info); } .hs.unit { border-left-color: #8b95a3; } .hs.unknown { border-left-color: var(--muted); color: #c3cad3; }
  .hs:not([data-visible]) { opacity: 0; }
  body.floor .hs { white-space: nowrap; max-width: none; font-size: 10.5px; padding: 3px 7px; }
  body.pulled .hs, body.pulled .legend, body.pulled #seg, body.pulled #explode, body.pulled .note { display: none; }
  .legend .nb { color: var(--muted); margin-top: 2px; }
  @media (max-width: 480px) { body.tower .note { display: none; } }
  @media (max-width: 480px) { .hs { font-size: 11px; padding: 4px 7px; max-width: 150px; } }
</style>
</head>
<body class="tower">
<model-viewer id="mv" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="auto" interaction-prompt="auto" camera-controls touch-action="pan-y" shadow-intensity="1" exposure="1.1" camera-orbit="25deg 72deg 125%" alt="Tower with floors separated, from city records">
  <button slot="ar-button" class="btn" id="arbtn" type="button">Place on the table</button>
  <div id="status" slot="poster">Loading the building…</div>
  <div class="btn off" id="noar" hidden>AR needs Chrome on an ARCore phone · rotate the 3D model instead</div>
  <div class="rail glass" id="rail" role="group" aria-label="Pick a floor" hidden></div>
  <section class="card glass-strong" id="card" aria-live="polite" hidden></section>
</model-viewer>
<div class="top"><div class="title"><b id="name">FireSight</b><span id="sub">1:300 · from city records</span></div><a class="back glass" href="/">← Back</a></div>
<div class="tools">
  <div class="seg glass" id="seg" role="group" aria-label="Model" hidden><button type="button" id="v-tower" aria-pressed="true">Tower</button><button type="button" id="v-floor" aria-pressed="false">Inside floor</button></div>
  <button type="button" class="pill glass" id="explode" aria-pressed="true" hidden>Assemble</button>
  <button type="button" class="pill glass" id="back-tower" hidden>← Back to tower</button>
  <button type="button" class="pill glass" id="go-floor" hidden>Inside floor →</button>
  <p class="note" id="note">Not for operational use. Floors from footprint and height records; no interior is shown.</p>
</div>
<div class="legend glass-strong" id="legend"></div>
<p id="msg" class="glass-strong" role="status" hidden></p>
<script>
  // ?b=<building id>; only buildings with a generated model (web/scripts/ar-model.mts) are linked.
  // A building with an "inside floor" model (web/scripts/ar-floor.mts) also gets the Tower / Inside floor toggle.
  const id = (new URLSearchParams(location.search).get('b') || 'sf-3722080').replace(/[^\w-]/g, '');
  const mv = document.getElementById('mv');
  const $ = (i) => document.getElementById(i);
  const say = (t) => { $('msg').textContent = t; $('msg').hidden = !t; };
  const dot = (c, t) => `<div><i style="background:${c}"></i>${t}</div>`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ORBIT = { tower: '25deg 72deg 125%', floor: '15deg 40deg 92%' };
  const cache = {};
  const get = (key, dir = 'ar') => (cache[dir + key] ??= fetch(`/${dir}/${key}.json`).then((r) => (r.ok ? r.json() : Promise.reject(r.status))));
  mv.addEventListener('error', () => { $('status').textContent = 'Could not load the model.'; });

  let view = 'tower', assembled = false, sel = null, M = null, B = null, current = null;
  const floorName = (n) => (n === 0 ? 'B1' : `Floor ${n}`);

  // ---- labels: positions come from the JSON the model scripts write next to each GLB (model coordinates, metres) ----
  function showHotspots(list) {
    mv.querySelectorAll('.hs').forEach((e) => e.remove());
    for (const h of list) {
      const el = document.createElement('div');
      el.slot = `hotspot-${h.id}`;
      el.className = `hs ${h.tone}`;
      el.dataset.position = h.position;
      el.dataset.normal = h.normal;
      el.dataset.visibilityAttribute = 'visible';
      el.textContent = h.text;
      mv.appendChild(el);
    }
  }
  function chrome(m) {
    $('name').textContent = m.address;
    if (view === 'floor') {
      $('sub').textContent = `Inside floor ${m.floor} · 1:${Math.round(1 / m.scale)} · estimated`;
      $('legend').innerHTML = dot('#ff4d4f', 'Hazard room (spot estimated)') + dot('#ffb020', 'Cooking, open permits, wind') + dot('#5ee1ff', 'Entrances, hydrants, people') + dot('#8b95a3', 'Stairs: not on record');
      $('note').textContent = m.banner;
      mv.alt = `Floor ${m.floor} of ${m.address}: schematic layout with hazard rooms glowing. No public floor plan exists.`;
    } else {
      const fire = m.fireFloor != null;
      $('sub').textContent = (fire ? `Fire floor ${m.fireFloor} · ` : '') + '1:300 · from city records';
      $('legend').innerHTML = (fire ? dot('#ff4d4f', 'Fire floor') + dot('#ffb020', 'Floors above the fire') : '') + dot('#5ee1ff', 'People on record') + '<div class="nb">Not for operational use</div>';
      $('note').textContent = 'Not for operational use. Floors from footprint and height records; no interior is shown.';
      mv.alt = 'Tower with floors separated, from city records: fire floor in red, floors above it in amber, floors with recorded people in cyan';
    }
  }

  // ---- pick a floor: highlight one floor slab through model-viewer's scene graph, dim the rest ----
  const orig = new Map();
  const FLOOR = /^(Floor (\d+)|B1)$/;
  const num = (name) => { const m = FLOOR.exec(name); return m ? (m[2] ? Number(m[2]) : 0) : null; };
  function capture() {
    orig.clear();
    if (!mv.model) return;
    for (const m of mv.model.materials) orig.set(m.name, { c: [...m.pbrMetallicRoughness.baseColorFactor], e: [...m.emissiveFactor] });
  }
  function paint() {
    if (!mv.model) return;
    try {
      for (const m of mv.model.materials) {
        const n = num(m.name), o = orig.get(m.name);
        if (n === null || !o) continue;
        const on = sel !== null && view === 'tower';
        if (!on) { m.pbrMetallicRoughness.setBaseColorFactor(o.c); m.setEmissiveFactor(o.e); m.setAlphaMode('OPAQUE'); }
        else if (n === sel) { m.pbrMetallicRoughness.setBaseColorFactor([0.05, 0.3, 1, 1]); m.setEmissiveFactor([0, 0.05, 0.2]); m.setAlphaMode('OPAQUE'); }
        else { m.pbrMetallicRoughness.setBaseColorFactor([o.c[0], o.c[1], o.c[2], 0.22]); m.setEmissiveFactor([o.e[0] * 0.4, o.e[1] * 0.4, o.e[2] * 0.4]); m.setAlphaMode('BLEND'); }
      }
    } catch (e) { console.warn('floor highlight unavailable', e); }
  }
  mv.addEventListener('load', () => { capture(); paint(); });

  // sentence case for record labels that arrive in capitals; keep the acronyms
  const sentence = (s) => { const t = s === s.toUpperCase() ? s.toLowerCase() : s; return (t.charAt(0).toUpperCase() + t.slice(1)).replace(/\b(sffd|dbi|ul|pv|ev|b1|aqi|osm|hvac)\b/gi, (x) => x.toUpperCase()); };
  const year = (d) => (d || '').slice(0, 4);
  const src = (e) => (e ? `${e.source.replace(/^DataSF /, '')}${year(e.asOf) ? ' · ' + year(e.asOf) : ''}` : '');
  function card(n) {
    const c = $('card');
    if (n === null || !B) { c.hidden = true; c.innerHTML = ''; $('legend').hidden = false; return; }
    const f = (B.floorFacts || []).find((x) => x.floor === n) || {};
    const pins = B.pins.filter((p) => p.anchor.kind === 'floor' && p.anchor.floor === n);
    const peopleRe = /(\d[\d,]*)\s+(people|occupants|units)/i;
    const ppl = [];
    if (f.occupantLoad) ppl.push(`<li class="people">${f.occupantLoad} people (assembly permit)</li>`);
    else for (const p of pins) if (peopleRe.test(p.label)) ppl.push(`<li class="people">${esc(sentence(p.label))}<small>${esc(src(p.evidence[0]))}</small></li>`);
    if ((f.units || []).length) ppl.push(`<li class="people">${f.units.length} ${f.units.length === 1 ? 'unit' : 'units'} named in permits (lower bound)</li>`);
    for (const o of f.occupants || []) ppl.push(`<li class="people">${esc(o.kind)}${o.hazard ? ' · ' + esc(o.hazard.toLowerCase()) : ''}<small>${esc(o.source)}</small></li>`);
    const haz = pins.filter((p) => (p.severity === 'danger' || p.severity === 'caution') && !peopleRe.test(p.label))
      .map((p) => `<li class="${p.severity}">${esc(sentence(p.label))}<small>${esc(src(p.evidence[0]) || 'record')}</small></li>`);
    for (const r of f.rooms || []) if (!pins.some((p) => p.label.toLowerCase().includes(r.split(/[ /]/)[0].toLowerCase()))) haz.push(`<li class="caution">${esc(r)} named in records</li>`);
    if (f.openPermits) haz.push(`<li class="caution">${f.openPermits} open permits: expect open walls</li>`);
    if (f.incidents) haz.push(`<li class="caution">${f.incidents} past fire ${f.incidents === 1 ? 'incident' : 'incidents'} began here</li>`);
    const nor = (f.notOnRecord || []).filter((x) => !/stair/i.test(x));
    const fireTag = M && M.fireFloor === n ? '<em>Fire floor</em>' : '';
    c.innerHTML = `<button class="x" type="button" aria-label="Close floor details">×</button><h3>${n === 0 ? 'Basement (B1)' : 'Floor ' + n}${fireTag}</h3>`
      + `<h4>People</h4><ul>${ppl.join('') || '<li>None on record</li>'}</ul>`
      + `<h4>Hazards</h4><ul>${haz.join('') || '<li>None on record</li>'}</ul>`
      + (nor.length ? `<h4>Not on record</h4><ul>${nor.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '');
    c.hidden = false;
    $('legend').hidden = true;
    c.scrollTop = 0;
    c.querySelector('.x').onclick = () => select(null);
  }
  // ---- pull-out: the picked floor slides toward you and grows while the rest fades (a baked glTF animation, plays in AR too) ----
  const DUR = 1.2; // seconds, as baked by ar-model.mts
  let pulled = null, fk = null, run = 0, cardOpen = false;
  const clip = (n) => `pull-${n === 0 ? 'B1' : n}`;
  const canPull = (n) => view === 'tower' && !assembled && (mv.availableAnimations || []).includes(clip(n));
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function ui() {
    document.body.classList.toggle('pulled', pulled !== null);
    $('back-tower').hidden = pulled === null || !cardOpen;
    $('go-floor').hidden = !(pulled !== null && cardOpen && M && (M.insideFloors || []).includes(pulled));
    if (pulled !== null) $('go-floor').textContent = pulled === 0 ? 'Inside B1 →' : `Inside floor ${pulled} →`;
  }
  // dir 1 = out, -1 = back in. The clip holds its last frame when it finishes.
  function play(n, dir, done) {
    const token = ++run;
    let fin = false;
    mv.animationName = clip(n);
    mv.timeScale = reduced ? 50 * dir : dir;
    mv.currentTime = dir > 0 ? 0 : DUR;
    const end = () => {
      mv.removeEventListener('finished', end);
      if (token !== run || fin) return;
      fin = true;
      mv.pause();
      mv.currentTime = dir > 0 ? DUR : 0;
      done();
    };
    mv.addEventListener('finished', end);
    mv.play({ repetitions: 1 });
    // model-viewer loops the clip whatever "repetitions" says, so stop it on our own clock and hold the last frame
    setTimeout(() => { if (token === run) end(); }, (DUR * 1000) / Math.abs(mv.timeScale) - 30);
  }
  function select(n) {
    const was = sel;
    sel = n === sel ? null : n;
    paint();
    document.querySelectorAll('#rail button').forEach((b) => {
      const on = sel !== null && Number(b.dataset.n) === sel;
      b.setAttribute('aria-pressed', String(on));
      if (on) b.scrollIntoView({ block: 'nearest' });
    });
    cardOpen = false;
    if (sel === null) {
      card(null);
      if (pulled !== null) { const p = pulled; pulled = null; ui(); play(p, -1, () => {}); }
      return;
    }
    if (!canPull(sel)) { card(sel); cardOpen = true; ui(); return; }
    card(null);
    pulled = sel;
    ui();
    play(sel, 1, () => { if (sel === pulled) { card(sel); cardOpen = true; ui(); } });
  }
  function buildRail() {
    const rail = $('rail');
    const col = { fire: '#ff4d4f', people: '#5ee1ff' };
    rail.innerHTML = [...M.floors].sort((a, b) => b.n - a.n).map((f) => `<button type="button" data-n="${f.n}" aria-pressed="false" aria-label="${f.n === 0 ? 'Basement' : 'Floor ' + f.n}">${col[f.kind] ? `<i style="background:${col[f.kind]}"></i>` : ''}${f.n === 0 ? 'B1' : f.n}</button>`).join('');
    rail.onclick = (e) => { const b = e.target.closest('button'); if (b) select(Number(b.dataset.n)); };
  }
  // tap the model: a tap (not a drag) on a floor slab picks it
  let down = null;
  mv.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: Date.now() }; });
  mv.addEventListener('pointerup', (e) => {
    if (!down || view !== 'tower' || e.target.closest('.rail, .card')) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = Date.now() - down.t;
    down = null;
    if (moved > 8 || dt > 600) return;
    const r = mv.getBoundingClientRect();
    const m = mv.materialFromPoint(e.clientX - r.left, e.clientY - r.top);
    const n = m ? num(m.name) : null;
    if (n !== null) select(n);
  });

  // ---- which model is showing: Tower (exploded or assembled) or Inside floor ----
  function setView(next, floorKey) {
    const key = next === 'floor' ? floorKey : id + (assembled ? '-assembled' : '');
    if (current === key) return;
    current = key; view = next;
    document.body.className = view;
    pulled = null; run++; cardOpen = false; ui();
    $('v-tower').setAttribute('aria-pressed', String(view === 'tower'));
    $('v-floor').setAttribute('aria-pressed', String(view === 'floor'));
    $('rail').hidden = view !== 'tower' || !M;
    $('explode').hidden = view !== 'tower' || !M;
    $('seg').hidden = view === 'tower' && !fk;
    if (view === 'floor') { const fl = Number(/-f(\d+)$/.exec(key)[1]); $('v-floor').textContent = fl === 0 ? 'Inside B1' : `Inside floor ${fl}`; }
    else if (fk) $('v-floor').textContent = `Inside floor ${fk.split('-f')[1]}`;
    if (view === 'floor') { sel = null; card(null); }
    else if (sel !== null) { card(sel); cardOpen = true; ui(); }
    mv.setAttribute('camera-orbit', ORBIT[view]);
    mv.src = `/ar/${key}.glb`;
    get(view === 'floor' ? floorKey : id).then((m) => {
      if (current !== key) return;
      chrome(m);
      showHotspots(view === 'tower' && assembled ? m.assembledHotspots || m.hotspots : m.hotspots);
    }).catch(() => { /* labels are optional; the model still shows */ });
  }
  $('back-tower').onclick = () => select(null);
  $('explode').onclick = () => {
    assembled = !assembled;
    $('explode').textContent = assembled ? 'Explode' : 'Assemble';
    $('explode').setAttribute('aria-pressed', String(!assembled));
    setView('tower');
  };
  get(id).then((m) => {
    M = m;
    buildRail();
    $('rail').hidden = view !== 'tower';
    $('explode').hidden = view !== 'tower';
    get(id, 'buildings').then((b) => { B = b; }).catch(() => {});
    // "Inside floor N" exists for every floor listed in insideFloors (web/scripts/ar-floor.mts)
    $('v-tower').onclick = () => setView('tower');
    $('go-floor').onclick = () => { if (pulled !== null) setView('floor', `${id}-f${pulled}`); };
    if (m.fireFloor != null && (m.insideFloors || []).includes(m.fireFloor)) {
      fk = `${id}-f${m.fireFloor}`; // the hero's fire floor also gets a Tower / Inside floor toggle
      $('v-floor').onclick = () => setView('floor', fk);
      if (view === 'tower') { $('v-floor').textContent = `Inside floor ${m.fireFloor}`; $('seg').hidden = false; }
    }
  }).catch(() => {});
  setView('tower');

  // model-viewer shows its own button only when this browser can place models; otherwise say what is needed.
  const noar = $('noar');
  const check = () => { noar.hidden = !!mv.canActivateAR; };
  mv.addEventListener('load', () => { check(); setTimeout(check, 1500); });
  mv.addEventListener('ar-status', (e) => {
    const s = e.detail && e.detail.status;
    if (s === 'failed') say('AR could not start. Update "Google Play Services for AR" in the Play Store, then reload this page.');
    else if (s === 'session-started' || s === 'object-placed') say('');
  });
</script>
</body>
</html>
